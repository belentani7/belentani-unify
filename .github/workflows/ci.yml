name: Audit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets tracked
        run: |
          fail=0
          tracked=$(git ls-files)
          for pattern in '.env' '*.env' '*.pem' '*.p12' '*.pfx' 'id_rsa' 'id_ed25519' '*.keystore' '.npmrc' '.netrc'; do
            hits=$(echo "$tracked" | grep -E "(^|/)$pattern$" || true)
            if [ -n "$hits" ]; then
              echo "::error::Fichero sensible trackeado: $pattern"
              echo "$hits"
              fail=1
            fi
          done
          echo "$tracked" | grep -E '(^|/)\.env\.example$' >/dev/null && echo "::notice::\.env\.example presente (correcto)"
          exit $fail

      - name: Secret patterns
        run: |
          fail=0
          if git ls-files -z | xargs -0 -r grep -nEI '(sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' 2>/dev/null; then
            echo "::error::Se han encontrado patrones de credenciales. Revisa y rota lo que corresponda."
            fail=1
          fi
          exit $fail

      - name: JSON valido
        run: |
          fail=0
          for f in $(git ls-files '*.json' | grep -v 'package-lock.json' | head -100); do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" 2>/dev/null; then
              echo "::error::JSON invalido: $f"
              fail=1
            fi
          done
          exit $fail

      - name: HTML basico
        run: |
          fail=0
          for f in $(git ls-files '*.html' | head -50); do
            if [ ! -s "$f" ]; then
              echo "::error::HTML vacio: $f"; fail=1; continue
            fi
            grep -qi '<title' "$f" || { echo "::error::Sin <title>: $f"; fail=1; }
            grep -qi '<html' "$f" || { echo "::error::Sin <html>: $f"; fail=1; }
          done
          exit $fail

      - name: Resumen
        run: echo "Audit completado sobre $(git ls-files | wc -l) ficheros."