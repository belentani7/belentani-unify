name: Audit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin ficheros de credenciales trackeados
        run: |
          fail=0
          tracked=$(git ls-files)
          for pattern in '\.env$' '\.env\.[a-z]+$' '\.pem$' '\.p12$' '\.pfx$' 'id_rsa$' 'id_ed25519$' '\.keystore$' '\.npmrc$' '\.netrc$'; do
            hits=$(echo "$tracked" | grep -E "$pattern" || true)
            if [ -n "$hits" ]; then
              echo "::error file=.env::Fichero sensible trackeado ($pattern):"
              echo "$hits"
              fail=1
            fi
          done
          if echo "$tracked" | grep -qE '(^|/)\.env\.example$'; then
            echo "Plantilla .env.example presente (correcto)."
          fi
          exit $fail

      - name: Sin patrones de credenciales
        run: |
          fail=0
          if git ls-files -z \
            | xargs -0 -r grep -IEn \
                '(sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            2>/dev/null; then
            echo "::error::Se han encontrado patrones de credenciales. Revisa y rota lo que corresponda."
            fail=1
          fi
          exit $fail

      - name: JSON valido
        run: |
          warn=0
          for f in $(git ls-files '*.json' | grep -v 'package-lock.json' | head -100); do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" 2>/dev/null; then
              echo "::warning file=$f::JSON no parseable"
              warn=1
            fi
          done
          if [ "$warn" = 1 ]; then echo "Hay JSON que no parsea. Revisar si es intencionado."; fi
          exit 0

      - name: HTML basico
        run: |
          warn=0
          for f in $(git ls-files '*.html' | head -60); do
            [ -s "$f" ] || continue
            if grep -qi '<html' "$f"; then
              grep -qi '<title' "$f" || { echo "::warning file=$f::Documento HTML sin <title>"; warn=1; }
              grep -qi '<meta[^>]*name=["'"'"']description' "$f" || { echo "::warning file=$f::Documento HTML sin meta description"; warn=1; }
            fi
          done
          if [ "$warn" = 1 ]; then echo "Revisar avisos de SEO en los HTML."; fi
          exit 0

      - name: Resumen
        run: echo "Audit ejecutado sobre $(git ls-files | wc -l) ficheros."